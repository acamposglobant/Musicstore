name: CI

on:
  push:
    branches: [main, master, 'integration/**', 'mig/**']
  pull_request:
    branches: [main, master, 'integration/**']

jobs:
  build-and-test:
    name: Build & Test (net10.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MusicStore.slnx

      - name: Build (zero warnings enforced)
        run: dotnet build MusicStore.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MusicStore.slnx --no-build --configuration Release --logger "trx" --results-directory ./test-results
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results
          retention-days: 7
